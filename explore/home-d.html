<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>SKY DIARY · Home layout 1</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="../reset.css" rel="stylesheet">
		<link href="explore.css" rel="stylesheet">
		<link href="strips.css" rel="stylesheet">
		<link href="../paper.css" rel="stylesheet">
		<link rel="icon" href="../asset/icon.png" type="image/png">
		<script src="../paper.js"></script>
		<style>
			/* Layout 1: text on the left, horizontal strips on the right */
			.layout{
				grid-template-columns: minmax(0, 320px) minmax(0, 680px);
				justify-content: space-between;
				align-items: start;
			}
			.text{ padding-top: 32px; }
			.panel{ height: min(740px, calc(100svh - 200px)); display: flex; flex-direction: column; }
			.layout .panel .strips{ flex-direction: column; flex: 1; min-height: 0; }
			.caption{ margin-top: 8px; }

			@media (max-width: 820px){
				.layout{ grid-template-columns: 1fr; }
				.text{ padding-top: 0; }
				.panel{ height: 62svh; }
			}
		</style>
	</head>
	<body>
		<div class="button right"><a href="../introduction/index.html"> > </a></div>

		<main class="layout">
			<section class="text">
				<h1>Welcome to my<br>Sky Diary.</h1>
				<p>This website documents the skies I captured in 2024.<br>Each sky captures a moment, a feeling, and a story told through colors and shapes.</p>
				<p class="sign">- Jenny Yen</p>
			</section>
			<section class="panel" aria-label="Every sky of 2024, in order">
				<div class="strips" data-direction="rows"></div>
				<p class="caption"></p>
			</section>
		</main>

		<nav class="option-bar"><span>Home</span><a href="home-d.html" aria-current="page">Layout 1</a><a href="home-e.html">Layout 2</a><a href="index.html">All options</a></nav>

		<script src="../introduction/data.js"></script>
		<script src="strips.js"></script>
	</body>
</html>
