<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>SKY DIARY · Process option C</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="../reset.css" rel="stylesheet">
		<link href="explore.css" rel="stylesheet">
		<link href="../paper.css" rel="stylesheet">
		<link rel="icon" href="../asset/icon.png" type="image/png">
		<style>
			/* Option C: watch every sky turn from photo, to colors, to shape */
			body{ padding: clamp(96px, 14vh, 140px) clamp(24px, 6vw, 96px) 120px; }

			.top{
				display: flex;
				justify-content: space-between;
				align-items: flex-end;
				flex-wrap: wrap;
				gap: 24px 48px;
			}
			.kicker{ font-size: 13px; font-weight: 300; color: #8A847E; }
			h1{
				margin-top: 10px;
				font-size: clamp(30px, 4.4vw, 56px);
				font-weight: 400;
				line-height: 1.05;
			}
			.top p.lede{
				margin-top: 14px;
				max-width: 520px;
				font-weight: 200;
				line-height: 1.55;
			}

			/* Step control */
			.steps{
				display: flex;
				align-items: center;
				gap: 4px;
				padding: 4px;
				background: white;
				border: 1px solid #E2DAD2;
				border-radius: 999px;
			}
			.steps button{
				padding: 9px 16px;
				border-radius: 999px;
				font-size: 14px;
				cursor: pointer;
			}
			.steps button[aria-pressed="true"]{ background: #282A2B; color: white; }
			.steps .arrow{ color: #AEA9A4; font-size: 12px; }

			/* Grid of skies */
			.grid{
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
				gap: 10px;
				margin-top: 40px;
			}
			.tile{
				position: relative;
				aspect-ratio: 1;
			}
			.tile > *{
				position: absolute;
				inset: 0;
				transition: opacity 0.7s ease, transform 0.7s ease, border-radius 0.7s ease;
			}
			.tile img{
				width: 100%;
				height: 100%;
				object-fit: cover;
				border-radius: 4px;
			}
			.tile .grad{ border-radius: 4px; opacity: 0; }
			.tile .shape{ opacity: 0; transform: scale(0.6); }
			.tile .label{
				inset: auto 0 -18px;
				font-size: 10px;
				font-weight: 300;
				text-align: center;
				color: #8A847E;
				opacity: 0;
			}

			.grid[data-step="colors"] img{ opacity: 0; }
			.grid[data-step="colors"] .grad{ opacity: 1; }
			.grid[data-step="shape"] img{ opacity: 0; }
			.grid[data-step="shape"] .shape{ opacity: 1; transform: scale(1); }
			.grid[data-step="shape"] .label{ opacity: 1; }
			.grid[data-step="shape"]{ row-gap: 28px; }

			/* Mood shapes (same set as the mood page) */
			.shape.happy{ border-radius: 50%; }
			.shape.calm{ inset: 22% 0; border-radius: 50%; }
			.shape.hopeful{ clip-path: polygon(50% 6%, 0 94%, 100% 94%); }
			.shape.grateful{ inset: 15%; transform-origin: center; clip-path: polygon(50% -20%, 120% 50%, 50% 120%, -20% 50%); }
			.shape.sad{ inset: 18%; border-radius: 0 100% 100% 100%; rotate: 45deg; }
			.shape.tired{ inset: 25% 0 25%; border-radius: 999px 999px 0 0; }
			.shape.neutral{ inset: 10%; }
			.shape.energetic{ clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
			.shape.overwhelming{ inset: 15% 0; clip-path: ellipse(85% 100% at bottom); -webkit-mask: radial-gradient(85% 100% at 50% 150%, #0000 calc(100% - 1px), #000); mask: radial-gradient(85% 100% at 50% 150%, #0000 calc(100% - 1px), #000); }
			.shape.unmotivated{ inset: 12% 0; clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%); }
			.shape.anxious{ inset: 20% 0 30%; clip-path: polygon(0 0, 100% 0, 90% 100%, 80% 0, 70% 100%, 60% 0, 50% 100%, 40% 0, 30% 100%, 20% 0, 10% 100%); }

			/* Behind it */
			.behind{
				margin-top: 80px;
				padding-top: 32px;
				border-top: 1px solid #E2DAD2;
			}
			.behind h2{ font-size: 22px; font-weight: 400; }
			.sketch-row{
				display: grid;
				grid-template-columns: 1fr 1.4fr 1.4fr;
				gap: 24px;
				margin-top: 24px;
				align-items: start;
			}
			.sketch-row figure{
				background: white;
				padding: 10px;
				box-shadow: 0 8px 24px rgba(40, 42, 43, 0.08);
			}
			.sketch-row img{ display: block; width: 100%; }
			.sketch-row figcaption{
				margin-top: 10px;
				font-size: 13px;
				font-weight: 300;
				line-height: 1.45;
			}

			@media (max-width: 820px){
				.sketch-row{ grid-template-columns: 1fr; }
				.grid{ grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 6px; }
			}
		</style>
		<script src="../paper.js"></script>
	</head>
	<body>
		<div class="button left"><a href="../introduction/index.html" data-back> < </a></div>
		<div class="button right"><a href="../mood/index.html"> > </a></div>

		<section class="top">
			<div>
				<p class="kicker">Process</p>
				<h1>From a photo to a shape.</h1>
				<p class="lede">Each of my 75 skies went through the same three steps. Tap through them to watch every sky change.</p>
			</div>
			<div class="steps" role="group" aria-label="Process step">
				<button type="button" data-step="photo" aria-pressed="true">1 Photo</button>
				<span class="arrow">→</span>
				<button type="button" data-step="colors" aria-pressed="false">2 Colors</button>
				<span class="arrow">→</span>
				<button type="button" data-step="shape" aria-pressed="false">3 Shape</button>
			</div>
		</section>

		<div class="grid" data-step="photo"></div>

		<section class="behind">
			<h2>Behind it</h2>
			<div class="sketch-row">
				<figure><img src="../asset/process/notebook.jpg" alt="Notebook page with layout sketches"><figcaption>Notebook sketches: a gradient that fills the screen, day into night, Taipei next to New York.</figcaption></figure>
				<figure style="background:#FBF8F4"><img src="../asset/process/shape-sketch.png" alt="Line drawings of each mood's shape"><figcaption>One shape for each feeling.</figcaption></figure>
				<figure><img src="../asset/process/diary-references.jpg" alt="Diary reference images"><figcaption>Diary as the medium: references for quiet paper, short notes, and things pasted in.</figcaption></figure>
			</div>
		</section>

		<nav class="option-bar"><span>Process</span><a href="process-a.html">A · Diary</a><a href="process-b.html">B · Sideways</a><a href="process-c.html" aria-current="page">C · Transform</a><a href="index.html">All options</a></nav>

		<script src="../introduction/data.js"></script>
		<script>
			const grid = document.querySelector('.grid');
			const skies = [...SKY_DATA].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
			grid.innerHTML = skies.map((s, k) => {
				const g = `linear-gradient(to top, ${s.colors.join(', ')})`;
				return `<div class="tile" style="--d:${k * 12}ms">
					<img src="../asset/${s.img}" alt="${s.date}, ${s.location}" loading="lazy">
					<div class="grad" style="background:${g}"></div>
					<div class="shape ${s.mood.toLowerCase()}" style="background:${g}"></div>
					<span class="label">${s.mood}</span>
				</div>`;
			}).join('');

			// Small stagger so the change ripples across the grid
			grid.querySelectorAll('.tile > *').forEach((el) => { el.style.transitionDelay = 'var(--d)'; });

			const buttons = document.querySelectorAll('.steps button');
			const order = ['photo', 'colors', 'shape'];
			let auto = true, k = 0;
			function go(step) {
				grid.dataset.step = step;
				buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.step === step)));
			}
			buttons.forEach((b) => b.addEventListener('click', () => { auto = false; go(b.dataset.step); }));

			// Cycles through the steps on its own until you click one
			setTimeout(function tick() {
				if (!auto) return;
				k = (k + 1) % order.length;
				go(order[k]);
				setTimeout(tick, 3500);
			}, 2500);
		</script>
	</body>
</html>
